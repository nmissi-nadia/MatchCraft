<div class="min-h-screen bg-stone-50 text-gray-900 p-8 font-sans">
  <div class="max-w-6xl mx-auto space-y-8">
    <div class="flex items-center justify-between">
      <h1 class="text-3xl font-extrabold tracking-tight text-gray-900">Mon Profil & Données d'IA</h1>
      <div *ngIf="successMessage" class="px-4 py-2 bg-green-50 text-green-800 border border-green-200 rounded-lg shadow-sm font-medium">
        {{ successMessage }}
      </div>
      <div *ngIf="errorMessage" class="px-4 py-2 bg-red-50 text-red-800 border border-red-200 rounded-lg shadow-sm font-medium">
        {{ errorMessage }}
      </div>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Informations Personnelles -->
      <div class="bg-white border border-gray-200 shadow-sm rounded-2xl p-8 space-y-6">
        <h2 class="text-xl font-bold text-gray-900 mb-4 border-b border-gray-200 pb-4">Informations de Base</h2>
        
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Prénom</label>
            <input type="text" formControlName="prenom" class="w-full bg-stone-50 border border-gray-300 rounded-lg p-3 text-gray-900 focus:ring-2 focus:ring-green-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Nom</label>
            <input type="text" formControlName="nom" class="w-full bg-stone-50 border border-gray-300 rounded-lg p-3 text-gray-900 focus:ring-2 focus:ring-green-500 focus:outline-none">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Email</label>
            <input type="email" formControlName="email" class="w-full bg-stone-50 border border-gray-300 rounded-lg p-3 text-gray-900 focus:ring-2 focus:ring-green-500 focus:outline-none">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Téléphone</label>
            <input type="text" formControlName="telephone" class="w-full bg-stone-50 border border-gray-300 rounded-lg p-3 text-gray-900 focus:ring-2 focus:ring-green-500 focus:outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Titre Professionnel</label>
          <input type="text" formControlName="titreProfessionnel" class="w-full bg-stone-50 border border-gray-300 rounded-lg p-3 text-gray-900 focus:ring-2 focus:ring-green-500 focus:outline-none" placeholder="ex: Développeur Full-Stack Java/Angular">
        </div>

        <!-- Compétences Tags -->
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Compétences (Tags)</label>
          <div class="p-3 bg-stone-50 border border-gray-300 rounded-lg min-h-[50px] flex flex-wrap gap-2 items-center focus-within:ring-2 focus-within:ring-green-500">
            <span *ngFor="let skill of skills" class="px-3 py-1 bg-green-100 text-green-800 border border-green-200 rounded-full flex items-center text-sm font-bold shadow-sm">
              {{ skill }}
              <button type="button" (click)="removeSkill(skill)" class="ml-2 hover:text-green-900 focus:outline-none">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
              </button>
            </span>
            <input type="text" (keyup.enter)="addSkill($event)" placeholder="Ajouter une compétence et valider (Entrée)..." class="flex-grow bg-transparent border-none focus:ring-0 text-gray-900 placeholder-gray-400 outline-none">
          </div>
        </div>

        <button type="submit" [disabled]="!profileForm.valid" class="w-full py-3 bg-green-700 hover:bg-green-800 text-white font-bold rounded-xl shadow-sm transition-colors disabled:opacity-50">
          Sauvegarder le profil
        </button>
      </div>

      <div class="space-y-8">
        <!-- Section GitHub -->
        <div class="bg-[#f5f5dc] border border-stone-200 shadow-sm rounded-2xl p-8">
          <h2 class="text-xl font-bold text-gray-900 mb-4 flex items-center">
            <svg class="w-6 h-6 mr-3 text-gray-700" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd"></path></svg>
            Synchronisation GitHub
          </h2>
          <div class="flex space-x-4">
            <div class="flex-grow">
              <label class="block text-xs font-bold text-stone-600 uppercase tracking-wider mb-2">Pseudonyme GitHub</label>
              <input type="text" formControlName="githubUsername" class="w-full bg-white border border-stone-300 rounded-lg p-3 text-gray-900 focus:ring-2 focus:ring-stone-400 focus:outline-none">
            </div>
            <div class="flex items-end">
              <button type="button" (click)="syncGithub()" [disabled]="isSyncing" class="px-6 py-3 bg-stone-800 hover:bg-stone-900 text-white font-bold rounded-xl shadow-sm transition-colors disabled:opacity-50">
                {{ isSyncing ? 'Synchronisation...' : 'Synchroniser' }}
              </button>
            </div>
          </div>
          
          <div class="mt-4 pt-4 border-t border-stone-300">
            <p class="text-xs font-bold text-stone-600 mb-2 uppercase tracking-wider">{{ githubProjects.length }} Projets synchronisés</p>
            <div class="max-h-[150px] overflow-y-auto space-y-2 pr-2">
              <div *ngFor="let project of githubProjects" class="p-3 bg-white rounded-lg border border-stone-200 text-sm font-medium text-gray-800 shadow-sm">
                {{ project.nom }}
              </div>
            </div>
          </div>
        </div>

        <!-- Section CV Textuel -->
        <div class="bg-white border border-gray-200 shadow-sm rounded-2xl p-8 h-[350px]">
          <h2 class="text-xl font-bold text-gray-900 mb-4">CV Textuel (Matière pour l'IA)</h2>
          <textarea formControlName="cvTextuel" class="w-full h-[230px] bg-stone-50 border border-gray-300 rounded-lg p-4 text-gray-700 focus:ring-2 focus:ring-green-500 focus:outline-none resize-none font-mono text-sm leading-relaxed" placeholder="Collez ici l'intégralité du texte de votre CV (expériences, formations, bio)..."></textarea>
        </div>
      </div>
    </form>
  </div>
</div>
